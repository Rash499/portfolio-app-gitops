replicaCount:
  backend: 1
  frontend: 1

images:
  backend:
    repository: ghcr.io/rash499/interactive-system-architecture-portfolio-backend
    tag: latest
    pullPolicy: IfNotPresent

  frontend:
    repository: ghcr.io/rash499/interactive-system-architecture-portfolio-frontend
    tag: latest
    pullPolicy: Always

backend:
  service:
    type: ClusterIP
    port: 8000

frontend:
  service:
    type: NodePort
    port: 80
    nodePort: 30080

postgres:
  image:
    repository: postgres
    tag: "16"

  service:
    port: 5432

  database: portfolio
  username: portfolio
  password: portfolio-dev-password

  storage:
    size: 5Gi

ingress:
  enabled: false