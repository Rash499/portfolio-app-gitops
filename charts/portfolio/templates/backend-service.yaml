apiVersion: v1
kind: Service
metadata:
  name: {{ include "portfolio.fullname" . }}-backend
  labels:
    app: {{ include "portfolio.fullname" . }}-backend
spec:
  type: ClusterIP
  selector:
    app: {{ include "portfolio.fullname" . }}-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP